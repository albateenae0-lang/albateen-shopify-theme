<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} - {{ shop.name }}</title>
  {{ content_for_header }}
  
  <!-- Fonts & Tailwind -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#1c110e',
              main: '#231612',
              card: '#2d1d18',
              gold: '#d4a373',
              goldLight: '#e6c594',
              goldDark: '#9e7247',
              text: '#f8f5f0',
              muted: '#b3a59e',
              border: 'rgba(212, 163, 115, 0.2)'
            }
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            playfair: ['Playfair Display', 'serif'],
            tajawal: ['Tajawal', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-main text-brand-text font-tajawal min-h-screen flex flex-col selection:bg-brand-gold selection:text-brand-dark overflow-x-hidden">
  
  <main role="main">
    {{ content_for_layout }}
  </main>

</body>
</html>
